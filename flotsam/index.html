<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flotsam</title>
  </head>
  <body>
    <div id="app"></div>

    <div id="crosshair"></div>

    <div id="readout"></div>

    <div id="overlay">
      <h1>flotsam</h1>
      <p class="sub">Seascape, ported from GLSL to WGSL</p>
      <p class="cta">click to sail</p>
      <ul class="keys">
        <li><b>W</b> / <b>S</b> throttle</li>
        <li><b>A</b> / <b>D</b> rudder</li>
        <li><b>mouse</b> look around</li>
        <li><b>esc</b> release cursor</li>
        <li>sail into flotsam to collect it</li>
      </ul>
      <p class="credit">shader: <a href="https://www.shadertoy.com/view/Ms2SD1" target="_blank" rel="noreferrer">Seascape by TDM</a></p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
